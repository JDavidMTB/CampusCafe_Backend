server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: producto-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/productos/**

            - id: categoria-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/categorias/**

            - id: cliente-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/clientes/**

            - id: empleado-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/empleados/**

            - id: sucursal-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/sucursales/**

            - id: inventario-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/inventario/**

            - id: pago-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/pagos/**

            - id: detalle-pedido-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/detalles/**

            - id: reporte-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/reportes/**

            - id: pedido-service
              uri: http://localhost:8090
              predicates:
                - Path=/api/pedidos/**