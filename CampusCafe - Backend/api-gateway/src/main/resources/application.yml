server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: producto-service
              uri: http://producto-service:8081
              predicates:
                - Path=/api/productos/**

            - id: categoria-service
              uri: http://categoria-service:8082
              predicates:
                - Path=/api/categorias/**

            - id: cliente-service
              uri: http://cliente-service:8083
              predicates:
                - Path=/api/clientes/**

            - id: empleado-service
              uri: http://empleado-service:8084
              predicates:
                - Path=/api/empleados/**

            - id: sucursal-service
              uri: http://sucursal-service:8085
              predicates:
                - Path=/api/sucursales/**

            - id: inventario-service
              uri: http://inventario-service:8086
              predicates:
                - Path=/api/inventario/**

            - id: pago-service
              uri: http://pago-service:8087
              predicates:
                - Path=/api/pagos/**

            - id: detalle-pedido-service
              uri: http://detalle-pedido-service:8088
              predicates:
                - Path=/api/detalles/**

            - id: reporte-service
              uri: http://reporte-service:8089
              predicates:
                - Path=/api/reportes/**

            - id: pedido-service
              uri: http://pedido-service:8090
              predicates:
                - Path=/api/pedidos/**
