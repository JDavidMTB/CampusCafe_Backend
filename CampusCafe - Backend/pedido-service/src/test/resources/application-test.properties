# Usamos la h2 para no ensuciar la BD real
spring.datasource.url=jdbc:h2:mem:test_pedido_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crea y destruye las tablas automáticamente
spring.jpa.hibernate.ddl-auto=create-drop

# Apagamos Eureka para que la prueba no intente conectarse al API Gateway
eureka.client.enabled=false