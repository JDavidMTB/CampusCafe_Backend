version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: campuscafe
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  producto-service:
    build: ./producto-service
    container_name: producto-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  categoria-service:
    build: ./categoria-service
    container_name: categoria-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  cliente-service:
    build: ./cliente-service
    container_name: cliente-service
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  empleado-service:
    build: ./empleado-service
    container_name: empleado-service
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  sucursal-service:
    build: ./sucursal-service
    container_name: sucursal-service
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  inventario-service:
    build: ./inventario-service
    container_name: inventario-service
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  pago-service:
    build: ./pago-service
    container_name: pago-service
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  detalle-pedido-service:
    build: ./detalle-pedido-service
    container_name: detalle-pedido-service
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  reporte-service:
    build: ./reporte-service
    container_name: reporte-service
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  pedido-service:
    build: ./pedido-service
    container_name: pedido-service
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - producto-service
      - categoria-service
      - cliente-service
      - empleado-service
      - sucursal-service
      - inventario-service
      - pago-service
      - detalle-pedido-service
      - reporte-service
      - pedido-service
    restart: on-failure

volumes:
  mysql_data: